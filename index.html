  catch(e){var c=e&&e.code;warn=(c==='rejected_extension'||c==='extension_not_enabled')?'HTML download is not enabled here. Use the Export menu at the top, then HTML.':'';}
  render();
}
async function publishNow(){
  var art=null;try{art=await claude.use('artifact');}catch(e){}
  if(!art){warn='Publishing is not available in this view.';render();return;}
  var snap=JSON.stringify({at:Date.now(),state:S}).replace(/</g,'\\u003c');
  warn='Publishing...';render();
  try{await art.publish(build(snap));}
  catch(e){var c=e&&e.code;warn=c==='conflict'?'':(c==='not_granted'||c==='not_writer')?'You do not have permission to publish.':'Publish failed ('+(c||'error')+'). Ask Claude to publish results.';render();}
}
})();
