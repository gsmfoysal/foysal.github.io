html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Bungee,Impact,sans-serif;color:var(--gold);font-size:clamp(26px,6vw,46px);margin:0 0 12px;font-weight:400}
.live{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;background:var(--card)}
.live b{color:var(--violet);margin-right:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:none;border:0;color:var(--mute);padding:9px 13px;border-radius:10px;font-size:14px;cursor:pointer;text-transform:uppercase}
.tab.on{background:var(--gold);color:#1b0b3a;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.note{color:var(--mute);font-size:13px;margin:0 0 14px;text-transform:uppercase}
.sc{overflow-x:auto;margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{color:var(--mute);font-size:12px;text-transform:uppercase;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
td{padding:9px 6px;text-align:center;border-bottom:1px solid #4a2a8a55;font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left;font-weight:600}
tr.out td.l{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;background:#34187080;border-left:4px solid var(--violet);border-radius:8px}
.row.adv{border-left-color:var(--gold)}
.row.out .nm{color:var(--red)}
.nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.val{color:var(--mute);font-variant-numeric:tabular-nums}
.stars{color:var(--gold)}

.grid2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.grid2 label,.fld{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.cols h3,.mt{margin:14px 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase}
.cols h3{margin-top:0}
.pod{border-radius:12px;padding:16px;text-align:center;margin-bottom:10px;border:2px solid}
.pod small{display:block;font-size:12px;letter-spacing:.08em;margin-bottom:4px}
.pod b{font-size:20px}
.p1{border-color:var(--gold);color:var(--gold);background:#ffd23f1a}
.p2{border-color:#9aa3c7;color:#c8cff0;background:#9aa3c71a}

.rbk .panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rbk .panel-head h2{font-size:1.5rem;letter-spacing:.02em}
.rbk .note{color:var(--muted);font-size:.85rem;margin:0}
.rbk .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}

.rbk .legend span.x::before{background:var(--out)}
.rbk .bracket{overflow-x:auto}
.rbk .bk{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr)) minmax(170px,1.1fr);gap:18px 14px;min-width:860px;align-items:start}
.rbk .bcol{display:grid;gap:4px;align-content:start}

.rbk .bcol h3 small{font-family:"Nunito Sans",sans-serif;font-weight:700;color:var(--muted);font-size:.75rem}
.rbk .bslot{display:flex;justify-content:space-between;gap:6px;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--elixir);border-radius:7px;padding:4px 8px;font-size:.83rem;font-weight:700}
.rbk .bslot.x span{color:var(--out);font-weight:800}
.rbk .bslot.dz{background:var(--out-soft);border-color:var(--out)}
.rbk .bslot em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

function def(){var a=[];for(var i=1;i<=10;i++)a.push(np(i));return {title:'My Tournament',players:a,nid:11,cutVote:2,pairs:null,groups:[]};}
function norm(){
  S.players=S.players||[];S.nid=S.nid||S.players.length+1;
  S.players.forEach(function(p){if(!p.id)p.id='p'+(S.nid++);if(p.v!==undefined){if(p.r1v===undefined)p.r1v=p.v;delete p.v;}});
  S.groups=S.groups||[];S.players.forEach(function(p){if(p.g&&!S.groups.some(function(q){return q.id===p.g;}))delete p.g;});
  if(typeof S.cutVote!=='number')S.cutVote=2;
  S.cutVote=Math.max(0,Math.min(S.cutVote,S.players.length-4));
}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function g(p,k){return p[k]||0;}
function byId(id){return S.players.filter(function(p){return p.id===id;})[0]||null;}
function fmt(t){t=Math.round(t||0);var m=Math.floor(t/60),s=t%60;return m?m+'m'+s+'s':s+'s';}
function parseT(v){v=String(v).trim().toLowerCase();if(!v)return 0;var m=v.match(/^(?:(\d+)\s*m)?\s*(?:(\d+(?:\.\d+)?)\s*s?)?$/);if(m&&(m[1]||m[2]))return Math.round((+m[1]||0)*60+(+m[2]||0));var c=v.match(/^(\d+):(\d{1,2})$/);if(c)return +c[1]*60+ +c[2];return 0;}
function sc(p,x){return {s:g(p,x+'s'),d:g(p,x+'d'),t:g(p,x+'t')};}
function played(q){return q.s>0||q.d>0||q.t>0;}
function better(A,B){if(A.s!==B.s)return A.s>B.s;if(A.d!==B.d)return A.d>B.d;return A.t<B.t;}
function rp(p,r){return g(p,'r'+r+'s')>0||g(p,'r'+r+'d')>0||g(p,'r'+r+'v')>0;}
function st(p,rs){var m=0,t=0,ds=0,v=0;rs.forEach(function(r){if(rp(p,r)){m++;ds+=g(p,'r'+r+'d');if(g(p,'r'+r+'s')===3)t++;}v+=g(p,'r'+r+'v');});return {m:m,t:t,a:m?ds/m:0,v:v};}
function vrank(rs){return S.players.slice().sort(function(a,b){var A=st(a,rs),B=st(b,rs);return B.v-A.v||B.t-A.t||B.a-A.a;});}
function duel(a,b,x){if(!a||!b)return null;var A=sc(a,x),B=sc(b,x);if(!played(A)||!played(B))return null;return better(A,B)?a:b;}
function other(m,w){return w?(w.id===m.a.id?m.b:m.a):null;}
function agg(p,G){var o={w:0,s:0,d:0,t:0,n:0};G.forEach(function(m){if(!m.a||!m.b)return;if(!played(sc(m.a,m.x))||!played(sc(m.b,m.x)))return;var q=sc(p,m.x);o.n++;o.s+=q.s;o.d+=q.d;o.t+=q.t;if(m.w&&m.w.id===p.id)o.w++;});return o;}
function betterS(A,B){if(A.w!==B.w)return A.w>B.w;if(A.s!==B.s)return A.s>B.s;if(A.d!==B.d)return A.d>B.d;return A.t<B.t;}
function calc(){
  var n=S.players.length,cut=Math.max(0,Math.min(S.cutVote,n-4)),vr=vrank([1,2]);
  var qfp=vr.slice(0,n-cut),vout=vr.slice(n-cut);
  var qr=qfp.slice().sort(function(a,b){var A=sc(a,'q'),B=sc(b,'q'),pa=played(A),pb=played(B);if(pa!==pb)return pa?-1:1;if(!pa)return 0;if(A.s===B.s&&A.d===B.d&&A.t===B.t)return 0;return better(A,B)?-1:1;});
  var qdone=qfp.every(function(p){return played(sc(p,'q'));});
  var semis=qr.slice(0,4),auto=[[semis[0],semis[3]],[semis[1],semis[2]]],pr=auto,manual=false;
  if(S.pairs&&S.pairs.length===2){var ids=[].concat(S.pairs[0],S.pairs[1]);
    var ok=ids.length===4&&ids.every(function(id){return semis.some(function(p){return p.id===id;});})&&new Set(ids).size===4;
    if(ok){pr=S.pairs.map(function(q){return q.map(byId);});manual=true;}}
  var sf=pr.map(function(p){return {a:p[0],b:p[1],x:'a',w:duel(p[0],p[1],'a')};});
  var fa=sf[0].w,fb=sf[1].w;
  var G=[1,2,3].map(function(k){return {a:fa,b:fb,x:'f'+k,w:duel(fa,fb,'f'+k)};});
  var A=fa?agg(fa,G):null,B=fb?agg(fb,G):null,champ=null,ru=null;
  if(fa&&fb&&A.n===3){champ=betterS(A,B)?fa:fb;ru=champ.id===fa.id?fb:fa;}
  var L=sf.map(function(s){return other(s,s.w);});
  var tp={a:L[0],b:L[1],x:'b',w:duel(L[0],L[1],'b')};
  return {n:n,cut:cut,vr:vr,vout:vout,qfp:qfp,qr:qr,qdone:qdone,semis:semis,auto:auto,manual:manual,sf:sf,G:G,fa:fa,fb:fb,A:A,B:B,f:{a:fa,b:fb,w:champ},champ:champ,ru:ru,tp:tp,third:tp.w};
}

function render(){

  else if(tab==='r1')h=roundTab([1],C);
  else if(tab==='r2')h=roundTab([1,2],C);
  else if(tab==='qf')h=qfTab(C);
  else if(tab==='sf'){h='<p class="note">Semifinal \u00b7 '+(C.manual?'manual':'auto')+' matchups. '+rule+(C.qdone?'':' Field is provisional until all Quarterfinal attacks are in.')+'</p>';C.sf.forEach(function(m,k){h+=card('SEMIFINAL '+(k+1),m,'a');});}
  else if(tab==='tp')h='<p class="note">3rd Place match \u00b7 the two semifinal losers. '+rule+'</p>'+card('3RD PLACE MATCH',C.tp,'b');
  else if(tab==='f'){
    h='<p class="note">Final \u00b7 3 matches between the two semifinal winners. Champion = most matches won, then total stars, then total destruction %, then lower total time.</p>';
    if(C.A)[[C.fa,C.A],[C.fb,C.B]].forEach(function(z){h+='<div class="row '+(C.champ&&C.champ.id===z[0].id?'adv':'')+'"><span class="nm">'+esc(z[0].n)+'</span><span class="val">'+z[1].w+'W \u00b7 '+z[1].s+'\u2605 \u00b7 '+z[1].d+'% \u00b7 '+fmt(z[1].t)+'</span></div>';});
    C.G.forEach(function(m,k){h+=card('FINAL MATCH '+(k+1),m,m.x);});
    h+='<div style="margin-top:16px">'+pod(C)+'</div>';
  } else { h=brTab(C); }
  var v=document.getElementById('view'),ae=document.activeElement,keep=ae&&ae.id==='bl'?ae.value:null;
  v.className='panel'+(tab==='br'?' rbk':'');
  v.innerHTML=bar()+h+foot();
  if(keep!==null&&document.getElementById('bl'))document.getElementById('bl').value=keep;
  document.getElementById('live').innerHTML=canScore()?'<b>\u25cf LIVE</b>RESULTS UPDATE AUTOMATICALLY AS EACH SCORE IS ENTERED.':'<b>\u25cf</b>RESULTS ARE UPDATED BY THE ORGANIZER AFTER EACH STAGE.';
  document.getElementById('auth').textContent=admin?'Admin mode: changes save automatically.':(scorer&&!denied?'Scorer mode: you can enter scores. Changes save automatically.':(scorer?'You do not have permission to enter scores. Ask the organizer for Contributor access.':(SNAPAT?'Results as of '+new Date(SNAPAT).toLocaleString()+'.':'Results have not been published yet.')));
}
(function(){try{var sn=JSON.parse(document.getElementById('snap').textContent);if(sn&&sn.state){S=sn.state;SNAPAT=sn.at||0;}}catch(e){}})();
var BASEK={id:1,n:1,g:1};
function canScore(){return admin||(scorer&&!denied);}
function stab(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(stab).join(',')+']';return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stab(o[k]);}).join(',')+'}';}
function split(){var st=JSON.parse(JSON.stringify(S)),sc={};
  st.players=S.players.map(function(p){var q={id:p.id,n:p.n},o={};if(p.g)q.g=p.g;Object.keys(p).forEach(function(k){if(!BASEK[k])o[k]=p[k];});sc[p.id]=o;return q;});
  return {st:st,sc:sc};}
function rebuild(){
  if(!RAW.state)return;
  var st=JSON.parse(JSON.stringify(RAW.state)),legacy=false;
  st.players=(st.players||[]).map(function(p){var q=Object.assign({},p),sc=RAW.scores[p.id]||{};Object.keys(q).forEach(function(k){if(!BASEK[k])legacy=true;});Object.keys(sc).forEach(function(k){q[k]=sc[k];});return q;});
  S=st;norm();
  LS=legacy?'':stab(split().st);
  Object.keys(RAW.scores).forEach(function(id){LW[id]=stab(RAW.scores[id]);});
}
function save(){
  if(!db)return;var x=split();
  if(admin){var js=stab(x.st);if(js!==LS){LS=js;db.doc('tracker/state').set(x.st).catch(function(){});}}
  Object.keys(x.sc).forEach(function(id){var js=stab(x.sc[id]);if(LW[id]!==js){LW[id]=js;db.doc('scores/'+id).set(x.sc[id]).catch(function(){if(!admin){denied=true;render();}});}});
  if(admin)Object.keys(LW).forEach(function(id){if(!x.sc[id]){delete LW[id];db.doc('scores/'+id).delete().catch(function(){});}});
}
var NOCONF={add:1,undo:1,autopairs:1,gadd:1,gauto:1,'bk:save':1,'bk:dlnow':1,publish:1,dlpub:1};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;pend=null;warn='';render();return;}
  var b=e.target.closest('[data-act]');if(!b||!admin||b.disabled)return;
  var a=b.dataset.act;warn='';
  if(a.indexOf('rm:')===0&&S.players.length<=4){warn='Minimum 4 players are needed.';pend=null;render();return;}
  if(!NOCONF[a]&&a.indexOf('bk:dl:')!==0&&pend!==a){pend=a;clearTimeout(tm);tm=setTimeout(function(){pend=null;render();},4000);render();return;}
  clearTimeout(tm);pend=null;
  if(a==='publish'){publishNow();return;}
  if(a==='dlpub'){downloadPublic();return;}
  if(a==='undo'){if(U.length){S=JSON.parse(U.pop());save();}}
  else if(a==='bk:save'){var l=document.getElementById('bl');if(db)db.collection('backups').add({label:l&&l.value||'Backup',at:Date.now(),state:JSON.stringify(S)}).catch(function(){warn='Backup failed.';render();});}
  else if(a.indexOf('bk:restore:')===0){var bk=BK.filter(function(x){return x.id===a.slice(11);})[0];if(bk){pushU();S=JSON.parse(bk.state);save();}}
  else if(a.indexOf('bk:del:')===0){if(db)db.collection('backups').doc(a.slice(7)).delete().catch(function(){});}
  else if(a==='bk:dlnow'){dlfile('current',S);}
  else if(a.indexOf('bk:dl:')===0){var bd=BK.filter(function(x){return x.id===a.slice(6);})[0];if(bd){try{dlfile(bd.label,JSON.parse(bd.state));}catch(x){}}}
  else if(a==='gadd'){pushU();S.groups.push({id:'g'+(S.nid++),name:'Group '+String.fromCharCode(65+S.groups.length%26)});save();}
  else if(a.indexOf('gdel:')===0){pushU();var gid=a.slice(5);S.groups=S.groups.filter(function(q){return q.id!==gid;});S.players.forEach(function(p){if(p.g===gid)delete p.g;});save();}
  else if(a==='gauto'){pushU();S.players.forEach(function(p,i){p.g=S.groups[i%S.groups.length].id;});save();}
  else if(a==='reset:groups'){pushU();S.groups=[];S.players.forEach(function(p){delete p.g;});save();}
  else if(a==='add'){pushU();var id='p'+(S.nid++);S.players.push({id:id,n:'Player '+(S.players.length+1)});save();}
  else if(a.indexOf('rm:')===0){pushU();S.players=S.players.filter(function(p){return p.id!==a.slice(3);});S.pairs=null;save();}
  else if(a==='autopairs'){pushU();S.pairs=null;save();}
  else if(a==='reset:names'){pushU();S.players.forEach(function(p,i){p.n='Player '+(i+1);});save();}
  else if(a.indexOf('reset:')===0){pushU();var k=a.slice(6);var keys=k==='all'?[].concat.apply([],Object.keys(RK).map(function(z){return RK[z];})):RK[k];clearKeys(keys);if(k==='all'||k==='qf'||k==='r1'||k==='r2')S.pairs=null;save();}
  render();
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(!canScore())return;
  if(!admin&&(el.id==='ttl'||el.id==='cut'||el.id==='bf'||el.dataset.pair||el.dataset.gname||el.dataset.pg))return;
  if(el.id==='ttl'){S.title=el.value;save();render();return;}
  if(el.id==='cut'){pushU();S.cutVote=+el.value;S.pairs=null;save();render();return;}
  if(el.dataset.gname){var q=S.groups.filter(function(x){return x.id===el.dataset.gname;})[0];if(q){q.name=el.value||q.name;save();}render();return;}
  if(el.dataset.pg){var pp=byId(el.dataset.pg);if(pp){if(el.value)pp.g=el.value;else delete pp.g;save();}render();return;}
  if(el.id==='bf'){var fl=el.files&&el.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result),stt=o.state||o;if(typeof stt==='string')stt=JSON.parse(stt);if(!stt||!stt.players)throw 0;pushU();S=stt;save();warn='';}catch(x){warn='This file is not a valid backup.';}render();};rd.readAsText(fl);el.value='';return;}
  if(el.dataset.pair){var sel=[].slice.call(document.querySelectorAll('[data-pair]')).map(function(x){return x.value;});
    if(new Set(sel).size===4){S.pairs=[[sel[0],sel[1]],[sel[2],sel[3]]];save();warn='';}else{warn='Pick 4 different players.';}
    render();return;}
  if(el.dataset.i!==undefined){var p=byId(el.dataset.i),k=el.dataset.k;if(!p)return;
    if(k==='n'){if(!admin)return;p.n=el.value;}else{var v=el.dataset.time?parseT(el.value):(Number(el.value)||0);if(v)p[k]=v;else delete p[k];}
    save();render();}
});
(async function(){
  try{u=await claude.use('user');admin=u?await u.canEdit():false;}catch(e){}
  try{db=await claude.use('db');}catch(e){}
  try{dlc=await claude.use('downloads');}catch(e){}
  if(!admin&&db&&u){try{scorer=(await u.can('data.write'))===true;}catch(e){}}
  if(admin)tab='ad';
  if(db&&(admin||scorer)){
    db.doc('tracker/state').onSnapshot(function(sn){if(sn.exists){RAW.state=JSON.parse(JSON.stringify(sn.data()));rebuild();}render();},function(){render();});
    db.collection('scores').onSnapshot(function(q){RAW.scores={};q.docs.forEach(function(d){RAW.scores[d.id]=JSON.parse(JSON.stringify(d.data()));});rebuild();render();},function(){});
    if(admin)db.collection('backups').orderBy('at','desc').limit(100).onSnapshot(function(q){BK=q.docs.map(function(d){var x=d.data();return {id:d.id,label:x.label,at:x.at,state:x.state};});render();},function(){});
  }
  render();
})();
render();
function build(snap){return HEAD+BODY+'<script type="application/json" id="snap">'+snap+'<\/script>\n<script>\n('+APP.toString()+')();\n<\/script>\n</body>\n</html>\n';}
async function downloadPublic(){
  if(!dlc){warn='Download is not available in this view.';render();return;}
  var snap=JSON.stringify({at:Date.now(),state:S}).replace(/</g,'\\u003c');
  try{await dlc.save({filename:'tournament-results.html',data:build(snap)});warn='';}
  catch(e){var c=e&&e.code;warn=(c==='rejected_extension'||c==='extension_not_enabled')?'HTML download is not enabled here. Use the Export menu at the top, then HTML.':'';}
  render();
}
async function publishNow(){
  var art=null;try{art=await claude.use('artifact');}catch(e){}
  if(!art){warn='Publishing is not available in this view.';render();return;}
  var snap=JSON.stringify({at:Date.now(),state:S}).replace(/</g,'\\u003c');
  warn='Publishing...';render();
  try{await art.publish(build(snap));}
  catch(e){var c=e&&e.code;warn=c==='conflict'?'':(c==='not_granted'||c==='not_writer')?'You do not have permission to publish.':'Publish failed ('+(c||'error')+'). Ask Claude to publish results.';render();}
}
})();
</script>
